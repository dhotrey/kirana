[kirana]
log_level = "DEBUG" # INFO, DEBUG, WARNING, ERROR, CRITICAL

[knowledge_base]
splitwise_csv_path = "../knowledge-base/splitwise/splitwise-export-26-04-2026.csv"



[cloudflare]
d1_database_name = "kirana"
ai_gateway_name = "kirana-ai-gateway"
vectorize_index_name = "kirana-reciept-summaries"
vectorize_embedding_model = "qwen3-vl-embedding-2b"
vectorize_index_dimension = 1536
vectorize_index_metadata_fields = ["receipt_id", "store_name", "date"] # receipt_id is the join key referenced by Cloudflare Vectorize metadata and the Tigris filename in subsequent steps.
vectorize_index_metadata_field_types = ["number", "string", "number"]

[tigris]
bucket_name = "kirana-kb-raw-data"
aws_endpoint_url_s3 = "https://t3.storage.dev"
aws_endpoint_url_iam = "https://iam.storage.dev"
aws_region = "auto"