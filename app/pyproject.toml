[project]
name = "kirana-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.96",
    "cloudflare>=4.3.1",
    "fastapi[standard]>=0.135.3",
    "httpx>=0.28.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.6",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "logfire[fastapi]>=4.31.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.9",
    "pillow>=12.2.0",
    "pydantic>=2.12.5",
    "pydantic-ai>=1.87.0",
    "pydantic-evals[logfire]>=1.87.0",
    "pytest>=9.0.3",
    "sentence-transformers[image]>=5.4.1",
    "uvicorn>=0.43.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]
